<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Klarert — Norsk compliance, ferdig kodet</title>
  <desc id="desc">HMS- og compliance-plattform bygget på arbeidsmiljøloven og internkontrollforskriften.</desc>

  <rect width="1200" height="630" fill="#1a3d32"/>

  <g opacity="0.06" fill="none" stroke="#2dd4bf" stroke-width="1">
    <path d="M0 80 L1200 80"/>
    <path d="M0 200 L1200 200"/>
    <path d="M0 430 L1200 430"/>
    <path d="M0 550 L1200 550"/>
    <path d="M120 0 L120 630"/>
    <path d="M520 0 L520 630"/>
    <path d="M1080 0 L1080 630"/>
  </g>

  <g transform="translate(90 90)">
    <rect x="0" y="0" width="48" height="180" rx="9" fill="#ffffff"/>
    <path d="M 50 110 L 175 196" stroke="#ffffff" stroke-width="40" stroke-linecap="round"/>
    <path d="M 42 102 L 92 152 L 180 30" fill="none" stroke="#2dd4bf" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="320" y="200" font-family="Inter, system-ui, sans-serif" font-size="50" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Klarert<tspan fill="#ffffff" opacity="0.85">.com</tspan>
  </text>

  <text x="90" y="370" font-family="'Libre Baskerville', Georgia, serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    Norsk compliance,
  </text>
  <text x="90" y="460" font-family="'Libre Baskerville', Georgia, serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-1.5">
    ferdig kodet.
  </text>
  <rect x="90" y="478" width="500" height="8" fill="#2dd4bf"/>

  <g transform="translate(90 540)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)"/>
    <text x="110" y="28" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">9 rammeverk dekket</text>

    <rect x="240" y="0" width="220" height="44" rx="22" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.18)"/>
    <text x="350" y="28" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">80+ AML-paragrafer</text>

