# Studio Builder CI — Vitest unit tests + studio:assert prebuild gate +
# typecheck + lint. Runs on every push + PR that touches any studio
# surface (src/lib/studio/**, modules/*/studio/**, supabase/migrations/
# 2026091412*) plus the StudioPage + admin/partners.
#
# Spec: specs/studio-builder.md §9.1 test strategy.

name: studio-ci

on:
  push:
    paths:
      - 'src/lib/studio/**'
      - 'src/components/studio/**'
      - 'src/pages/studio/**'
      - 'src/pages/admin/partners/**'
      - 'src/hooks/useStudio*'
      - 'modules/*/studio/**'
      - 'supabase/migrations/2026091412*.sql'
      - 'scripts/assert-studio-registry.ts'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    paths:
      - 'src/lib/studio/**'
      - 'src/components/studio/**'
      - 'src/pages/studio/**'
      - 'src/pages/admin/partners/**'
      - 'src/hooks/useStudio*'
      - 'modules/*/studio/**'
      - 'supabase/migrations/2026091412*.sql'
      - 'scripts/assert-studio-registry.ts'

jobs:
  studio-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Studio registry assertion (prebuild gate)
        run: pnpm run studio:assert

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Vitest — studio surface
        run: pnpm test

      - name: Lint studio surface
        run: |
          pnpm exec eslint \
            src/lib/studio \
            src/components/studio \
            src/pages/studio \
            src/pages/admin/partners \
            src/pages/platform/PlatformStudioGrantsPage.tsx \
            modules/compliance/studio \
            modules/survey/studio \
            modules/documents/studio \
            modules/learning/studio \
            modules/meetings/studio \
            modules/registers/studio \
            modules/dashboards/studio \
            modules/workflows/studio \
            scripts/assert-studio-registry.ts \
            scripts/studio-rls-profile.ts
